<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14233c"/>
      <stop offset="70%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#ff00ea"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ffaa" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Base Plate -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1f3b5c" stroke-width="4"/>

  <!-- Radar Grid Circles -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#18324e" stroke-width="3" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1e4064" stroke-width="3"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#25517e" stroke-width="3"/>

  <!-- Crosshairs -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#18324e" stroke-width="2"/>
  <line x1="40" y1="256" x2="472" y2="256" stroke="#18324e" stroke-width="2"/>

  <!-- Radar Sweep Cone -->
  <path d="M 256 256 L 398 114 A 200 200 0 0 0 256 56 Z" fill="url(#beamGrad)"/>

  <!-- Waterfall Spectrum Energy Bars (Base) -->
  <g opacity="0.6">
    <rect x="100" y="360" width="12" height="40" fill="#0052cc" rx="3"/>
    <rect x="120" y="330" width="12" height="70" fill="#00b074" rx="3"/>
    <rect x="140" y="310" width="12" height="90" fill="#00ffaa" rx="3"/>
    <rect x="160" y="340" width="12" height="60" fill="#00b074" rx="3"/>
    <rect x="180" y="370" width="12" height="30" fill="#0052cc" rx="3"/>

    <rect x="220" y="320" width="12" height="80" fill="#00b074" rx="3"/>
    <rect x="240" y="270" width="14" height="130" fill="#00ffff" rx="3"/>
    <rect x="260" y="250" width="14" height="150" fill="#ffff00" rx="3"/>
    <rect x="280" y="280" width="14" height="120" fill="#00ffff" rx="3"/>
    <rect x="300" y="350" width="12" height="50" fill="#0052cc" rx="3"/>

    <rect x="340" y="330" width="12" height="70" fill="#00b074" rx="3"/>
    <rect x="360" y="290" width="12" height="110" fill="#ff00ea" rx="3"/>
    <rect x="380" y="350" width="12" height="50" fill="#0052cc" rx="3"/>
  </g>

  <!-- Glowing RF Frequency Wave -->
  <path d="M 60 300 Q 110 290 140 240 T 200 290 T 256 120 T 310 280 T 360 210 T 410 290 T 452 300" 
        fill="none" stroke="url(#waveGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Target Reticle on Main Peak -->
  <circle cx="256" cy="120" r="18" fill="none" stroke="#ffff00" stroke-width="4"/>
  <circle cx="256" cy="120" r="6" fill="#ffff00"/>
  <line x1="256" y1="92" x2="256" y2="106" stroke="#ffff00" stroke-width="3"/>
  <line x1="256" y1="134" x2="256" y2="148" stroke="#ffff00" stroke-width="3"/>
  <line x1="228" y1="120" x2="242" y2="120" stroke="#ffff00" stroke-width="3"/>
  <line x1="270" y1="120" x2="284" y2="120" stroke="#ffff00" stroke-width="3"/>

  <!-- AI Neural Pictogram Nodes -->
  <g fill="#00f0ff" stroke="#003355" stroke-width="2">
    <circle cx="160" cy="180" r="8"/>
    <circle cx="350" cy="170" r="8"/>
    <circle cx="130" cy="220" r="6"/>
    <circle cx="380" cy="220" r="6"/>
  </g>
  <line x1="160" y1="180" x2="256" y2="120" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>
  <line x1="350" y1="170" x2="256" y2="120" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Center SDR Beacon -->
  <circle cx="256" cy="256" r="12" fill="#00ffaa"/>
  <circle cx="256" cy="256" r="24" fill="none" stroke="#00ffaa" stroke-width="3" opacity="0.8"/>

  <!-- Badge Text: AI SCAN -->
  <rect x="186" y="420" width="140" height="34" rx="8" fill="#08101a" stroke="#00f0ff" stroke-width="2"/>
  <text x="256" y="443" fill="#00f0ff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">AI SCANNER</text>
</svg>
