[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picto-sight-h8"
version = "3.3.0"
description = "DynoGatorLabs Wasteland SIGINT Platform • Hailo-8 (26 TOPS) Full-Spectrum Multi-Pass RF Smart Scanner, 1024x Ultra-Zoom Classifier, Live TV & ADS-B Radar, Precision Gqrx Studio + Pixel 9 Pro XL Handset Remote for Raspberry Pi 5 & HackRF One"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "DynoGator" }
]
keywords = [
  "sdr",
  "hackrf",
  "hailo-8",
  "npu",
  "gqrx",
  "atsc",
  "ads-b",
  "rf-scanner",
  "spectrogram",
  "sigint",
  "raspberry-pi-5",
  "debian-trixie",
  "pyqt6"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Ham Radio",
  "Topic :: Multimedia :: Video :: Display",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.0",
  "pyserial>=3.5",
]

[project.scripts]
picto-sight = "smart_scanner_cli:main"

[project.urls]
Homepage = "https://github.com/DynoGator/picto-sight-h8"
Repository = "https://github.com/DynoGator/picto-sight-h8.git"
Releases = "https://github.com/DynoGator/picto-sight-h8/releases"
Issues = "https://github.com/DynoGator/picto-sight-h8/issues"

[tool.setuptools]
py-modules = ["smart_scanner_cli"]

[tool.setuptools.packages.find]
include = ["core*", "ui*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
